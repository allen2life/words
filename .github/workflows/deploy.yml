name: CI & Deployment Pipeline (words.loongclan.xyz)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build-and-test:
    name: Lint, Typecheck, Build & Headless Playtest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Validate Puzzle Content
        run: node scripts/validate-content.mjs

      - name: Typecheck & Production Build
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          echo "Build OK — $(du -sh dist | cut -f1) in $(find dist -type f | wc -l) files"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Headless Smoke Test
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          node scripts/smoke.mjs --url http://127.0.0.1:4173
          STATUS=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $STATUS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: words-dist
          path: dist/
          retention-days: 7

      - name: Upload QA Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: proof-records/*.png
          retention-days: 7
          if-no-files-found: ignore

  deploy-pages:
    name: Deploy to Cloudflare Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: words-dist
          path: dist

      - name: Verify Required Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing — cannot deploy."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing — cannot deploy."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shizangwenmai --branch=main

  verify-production:
    name: Verify Production (words.loongclan.xyz)
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Live Site (HTTP + asset integrity)
        run: |
          # 1. 首页必须返回 200（等待 CDN 传播）
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://words.loongclan.xyz/ || echo 000)
            echo "attempt $i → HTTP $CODE"
            [ "$CODE" = "200" ] && break
            [ "$i" = "20" ] && { echo "::error::words.loongclan.xyz did not return 200"; exit 1; }
            sleep 10
          done

          # 2. 线上 HTML 必须与本次构建产物一致（防止部署了但 CDN 仍旧版）
          curl -sS https://words.loongclan.xyz/ -o live.html
          EXPECTED=$(grep -oP 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          ACTUAL=$(grep -oP 'assets/index-[A-Za-z0-9_-]+\.js' live.html | head -1)
          echo "expected asset: $EXPECTED"
          echo "live asset    : $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Live site is serving a stale build (expected $EXPECTED, got $ACTUAL)"
            exit 1
          fi

          # 3. 该 JS 资源本身可访问，且非空
          SIZE=$(curl -sS -o /dev/null -w '%{size_download}' "https://words.loongclan.xyz/$ACTUAL")
          echo "bundle size: $SIZE bytes"
          [ "$SIZE" -gt 10000 ] || { echo "::error::bundle suspiciously small ($SIZE bytes)"; exit 1; }

          echo "✅ Production verified: fresh build $ACTUAL ($SIZE bytes) is live."

  # 真实浏览器验证独立成 job：需要 Playwright，耗时较长，
  # 与「刚部署完是否生效」的关注点分离，任一步失败都能明确定位。
  browser-smoke-production:
    name: Browser Smoke (Playwright vs production)
    needs: verify-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Live Production Smoke Test
        run: node scripts/smoke.mjs --url https://words.loongclan.xyz
